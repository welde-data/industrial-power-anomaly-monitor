name: CI - Equipment Monitoring

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run equipment checks
        run: |
          python scripts/check_equipment.py
